<!doctype html><html data-theme="light"><head><meta charset="utf-8"><title>Space scale</title>
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:14px;background:var(--surface-canvas);font-family:var(--font-sans);color:var(--text-primary)}.r{display:flex;align-items:baseline;gap:12px}.k{font:400 10px var(--font-mono);color:var(--text-tertiary);width:104px;flex:none}.cap{font:400 10px var(--font-mono);color:var(--text-tertiary)}.nm{font:500 11px var(--font-sans)}</style></head><body>
<div style="display:flex;align-items:flex-end;gap:6px"><div style="display:flex;flex-direction:column;align-items:center;gap:4px"><span style="width:2px;height:2px;background:var(--gold-300);border-radius:1px"></span><span class="cap">2</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:4px"><span style="width:4px;height:4px;background:var(--gold-300);border-radius:1px"></span><span class="cap">4</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:4px"><span style="width:6px;height:6px;background:var(--gold-300);border-radius:1px"></span><span class="cap">6</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:4px"><span style="width:8px;height:8px;background:var(--gold-300);border-radius:1px"></span><span class="cap">8</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:4px"><span style="width:12px;height:12px;background:var(--gold-300);border-radius:1px"></span><span class="cap">12</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:4px"><span style="width:16px;height:16px;background:var(--gold-300);border-radius:1px"></span><span class="cap">16</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:4px"><span style="width:20px;height:20px;background:var(--gold-300);border-radius:1px"></span><span class="cap">20</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:4px"><span style="width:24px;height:24px;background:var(--gold-300);border-radius:1px"></span><span class="cap">24</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:4px"><span style="width:32px;height:32px;background:var(--gold-300);border-radius:1px"></span><span class="cap">32</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:4px"><span style="width:40px;height:40px;background:var(--gold-300);border-radius:1px"></span><span class="cap">40 </body></html>
