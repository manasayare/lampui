<!-- @dsCard group="Colors" viewport="700x140" name="Warm graphite" subtitle="The 19-step neutral ramp everything else is built from" -->
<!doctype html><html data-theme="light"><head><meta charset="utf-8"><title>Warm graphite</title>
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:14px;background:var(--surface-canvas);font-family:var(--font-sans);color:var(--text-primary)}.sw{display:flex;gap:0}.sw>div{flex:1;height:52px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:4px;font:500 9px var(--font-mono);letter-spacing:0}.lb{display:flex;gap:0;margin-top:3px}.lb>div{flex:1;text-align:center;font:400 9px var(--font-mono);color:var(--text-tertiary)}.tile{display:flex;flex-direction:column;gap:5px;min-width:0}.tilerow{display:flex;gap:8px}.chip{flex:1;display:flex;flex-direction:column;gap:4px;min-width:0}.box{height:40px;border-radius:4px;border:1px solid var(--border-subtle)}.cap{font:400 10px var(--font-mono);color:var(--text-tertiary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.nm{font:500 11px var(--font-sans);color:var(--text-primary)}</style></head><body>
<div class="sw"><div style="background:var(--neutral-0);color:var(--neutral-900)">0</div><div style="background:var(--neutral-25);color:var(--neutral-900)">25</div><div style="background:var(--neutral-50);color:var(--neutral-900)">50</div><div style="background:var(--neutral-100);color:var(--neutral-900)">100</div><div style="background:var(--neutral-150);color:var(--neutral-900)">150</div><div style="background:var(--neutral-200);color:var(--neutral-900)">200</div><div style="background:var(--neutral-300);color:var(--neutral-900)">300</div><div style="background:var(--neutral-400);color:var(--neutral-900)">400</div><div style="background:var(--neutral-500);color:var(--neutral-900)">500</div><div style="background:var(--neutral-600);color:#fff">600</div><div style="background:var(--neutral-700);color:#fff">700</div><div style="background:var(--neutral-800);color:#fff">800</div><div style="background:var(--neutral-850);color:#fff">850</div><div style="background:var(--neutral-900);color:#fff">900</div><div style="background:var(--neutral-925);color:#fff">925</div><div style="background:var(--neutral-950);color:#fff">950</div><div style="background:var(--neutral-975);color:#fff">975</div><div style="background:var(--neutral-1000);color:#fff">1000</div></div><div class="lb"><div>0</div><div>25</div><div>50</div><div>100</div><div>150</div><div>200</div><div>300</div><div>400</div><div>500</div><div>600</div><div>700</div><div>800</div><div>850</div><div>900</div><div>925</div><div>950</div><div>975</div><div>1000</div></div><p style="margin:10px 0 0;font:400 12px/17px var(--font-sans);color:var(--text-secondary)">Slightly warm so gold sits naturally against it. Pure black is never a surface — dark mode bottoms out at Neutral 975 <span style="font-family:var(--font-mono)">#0B0B0A</span>.</p>
</body></html>
