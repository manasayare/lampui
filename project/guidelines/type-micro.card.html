<!-- @dsCard group="Type" viewport="700x160" name="Micro & uppercase" subtitle="The only place LAMP shouts — 10–11px system labels" -->
<!doctype html><html data-theme="light"><head><meta charset="utf-8"><title>Micro & uppercase</title>
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:14px;background:var(--surface-canvas);font-family:var(--font-sans);color:var(--text-primary)}.r{display:flex;align-items:baseline;gap:12px}.k{font:400 10px var(--font-mono);color:var(--text-tertiary);width:104px;flex:none}.cap{font:400 10px var(--font-mono);color:var(--text-tertiary)}.nm{font:500 11px var(--font-sans)}</style></head><body>
<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center"><span class="lamp-micro" style="color:var(--text-tertiary)">POLICY</span><span class="lamp-micro" style="color:var(--text-tertiary)">EXCEPTION</span><span class="lamp-micro" style="color:var(--text-tertiary)">INFERRED</span><span class="lamp-micro" style="color:var(--text-tertiary)">SIMULATION</span><span class="lamp-micro" style="color:var(--text-tertiary)">LIVE</span><span class="lamp-micro" style="color:var(--text-tertiary)">WORKING MEMORY</span></div><div style="margin-top:12px;display:flex;flex-direction:column;gap:6px"><div class="r"><span class="k">headings</span><span class="cap">−0.02em</span></div><div class="r"><span class="k">body</span><span class="cap">0</span></div><div class="r"><span class="k">labels</span><span class="cap">−0.005em</span></div><div class="r"><span class="k">micro caps</span><span class="cap">+0.06em</span></div><div class="r"><span class="k">mono</span><span class="cap">0</span></div></div><p style="margin:10px 0 0;font:400 12px/17px var(--font-sans);color:var(--text-secondary)">Everything else is sentence case — buttons, labels, dialogs, table headers. Never uppercase above 11px.</p>
</body></html>
