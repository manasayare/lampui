<!-- @dsCard group="Brand" viewport="700x170" name="Elevation" subtitle="Border first, shadow only for things that truly float" -->
<!doctype html><html data-theme="light"><head><meta charset="utf-8"><title>Elevation</title>
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:14px;background:var(--surface-canvas);font-family:var(--font-sans);color:var(--text-primary)}.cap{font:400 10px var(--font-mono);color:var(--text-tertiary)}.nm{font:500 11px var(--font-sans)}.note{margin:11px 0 0;font:400 12px/17px var(--font-sans);color:var(--text-secondary)}</style></head><body>
<div style="display:flex;gap:14px;align-items:flex-end"><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><span style="width:120px;height:56px;border:1px solid var(--border-default);border-radius:8px;background:var(--surface-primary);box-shadow:none"></span><span class="nm">0</span><span class="cap">Canvas</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><span style="width:120px;height:56px;border:1px solid var(--border-default);border-radius:8px;background:var(--surface-primary);box-shadow:var(--shadow-1)"></span><span class="nm">1</span><span class="cap">Panels</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><span style="width:120px;height:56px;border:1px solid var(--border-default);border-radius:8px;background:var(--surface-primary);box-shadow:var(--shadow-2)"></span><span class="nm">2</span><span class="cap">Popovers · menus</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><span style="width:120px;height:56px;border:1px solid var(--border-default);border-radius:8px;background:var(--surface-primary);box-shadow:var(--shadow-3)"></span><span class="nm">3</span><span class="cap">Dialogs · critical</span></div></div><p class="note">Most structure is communicated with 1px borders, surface contrast and spacing. Canvas objects rely on borders alone. Dark-theme shadows deepen but stay subtle.</p>
</body></html>
