<!-- @dsCard group="Colors" viewport="700x150" name="Surfaces — light" subtitle="Canvas, primary, secondary, raised, selected" -->
<!doctype html><html data-theme="light"><head><meta charset="utf-8"><title>Surfaces — light</title>
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:14px;background:var(--surface-canvas);font-family:var(--font-sans);color:var(--text-primary)}.sw{display:flex;gap:0}.sw>div{flex:1;height:52px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:4px;font:500 9px var(--font-mono);letter-spacing:0}.lb{display:flex;gap:0;margin-top:3px}.lb>div{flex:1;text-align:center;font:400 9px var(--font-mono);color:var(--text-tertiary)}.tile{display:flex;flex-direction:column;gap:5px;min-width:0}.tilerow{display:flex;gap:8px}.chip{flex:1;display:flex;flex-direction:column;gap:4px;min-width:0}.box{height:40px;border-radius:4px;border:1px solid var(--border-subtle)}.cap{font:400 10px var(--font-mono);color:var(--text-tertiary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.nm{font:500 11px var(--font-sans);color:var(--text-primary)}</style></head><body>
<div class="tilerow"><div class="chip"><div class="box" style="background:var(--surface-canvas)"></div><span class="nm">canvas</span><span class="cap">#F8F8F6</span></div><div class="chip"><div class="box" style="background:var(--surface-primary)"></div><span class="nm">primary</span><span class="cap">#FFFFFF</span></div><div class="chip"><div class="box" style="background:var(--surface-secondary)"></div><span class="nm">secondary</span><span class="cap">#F1F1EE</span></div><div class="chip"><div class="box" style="background:var(--surface-tertiary)"></div><span class="nm">tertiary</span><span class="cap">#E9E9E5</span></div><div class="chip"><div class="box" style="background:var(--surface-hover)"></div><span class="nm">hover</span><span class="cap">#F1F1EE</span></div><div class="chip"><div class="box" style="background:var(--surface-selected)"></div><span class="nm">selected</span><span class="cap">#FFF9E8</span></div></div><div style="margin-top:10px;display:flex;gap:8px;align-items:center"><span class="cap">borders</span><span style="flex:1;height:0;border-top:1px solid var(--border-subtle)"></span><span class="cap">subtle #E9E9E5</span><span style="flex:1;height:0;border-top:1px solid var(--border-default)"></span><span class="cap">default #DEDED9</span><span style="flex:1;height:0;border-top:1px solid var(--border-strong)"></span><span class="cap">strong #C8C8C0</span><span style="flex:1;height:0;border-top:1.5px solid var(--border-focus)"></span><span class="cap">focus #D6A82E</span></div>
</body></html>
