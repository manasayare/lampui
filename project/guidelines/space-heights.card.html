<!-- @dsCard group="Spacing" viewport="700x180" name="Control heights" subtitle="Desktop-first: 32px is the default control" -->
<!doctype html><html data-theme="light"><head><meta charset="utf-8"><title>Control heights</title>
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:14px;background:var(--surface-canvas);font-family:var(--font-sans);color:var(--text-primary)}.r{display:flex;align-items:baseline;gap:12px}.k{font:400 10px var(--font-mono);color:var(--text-tertiary);width:104px;flex:none}.cap{font:400 10px var(--font-mono);color:var(--text-tertiary)}.nm{font:500 11px var(--font-sans)}</style></head><body>
<div style="display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap"><div style="display:flex;flex-direction:column;align-items:center;gap:4px"><span style="width:64px;height:24px;border:1px solid var(--border-default);border-radius:6px;background:var(--surface-primary);display:grid;place-items:center;font:500 11px var(--font-sans)">24</span><span class="cap">xs</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:4px"><span style="width:64px;height:28px;border:1px solid var(--border-default);border-radius:6px;background:var(--surface-primary);display:grid;place-items:center;font:500 11px var(--font-sans)">28</span><span class="cap">sm</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:4px"><span style="width:64px;height:32px;border:1px solid var(--border-default);border-radius:6px;background:var(--surface-primary);display:grid;place-items:center;font:500 11px var(--font-sans)">32</span><span class="cap">md</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:4px"><span style="width:64px;height:40px;border:1px solid var(--border-default);border-radius:6px;background:var(--surface-primary);display:grid;place-items:center;font:500 11px var(--font-sans)">40</span><span class="cap">lg</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:4px"><span style="width:64px;height:48px;border:1px solid var(--border-default);border-radius:6px;background:var(--surface-primary);display:grid;place-items:center;font:500 11px var(--font-sans)">48</span><span class="cap">header</span></div></div><div style="margin-top:12px;display:grid;grid-template-columns:repeat(3,1fr);gap:4px 12px;font:400 11px var(--font-sans);color:var(--text-secondary)"><span>Top header 48</span><span>Toolbar 40</span><span>Status bar 28</span><span>Sidebar row 32</span><span>Inspector row 32</span><span>Table row 32 / 40 / 48</span></div><p style="margin:10px 0 0;font:400 12px/17px var(--font-sans);color:var(--text-secondary)">Compact desktop controls never go below 32px; touch surfaces step up to 44px.</p>
</body></html>
