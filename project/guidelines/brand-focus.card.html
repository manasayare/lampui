<!-- @dsCard group="Brand" viewport="700x180" name="Focus & selection" subtitle="Gold double ring; blue for multi-select" -->
<!doctype html><html data-theme="light"><head><meta charset="utf-8"><title>Focus & selection</title>
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:14px;background:var(--surface-canvas);font-family:var(--font-sans);color:var(--text-primary)}.cap{font:400 10px var(--font-mono);color:var(--text-tertiary)}.nm{font:500 11px var(--font-sans)}.note{margin:11px 0 0;font:400 12px/17px var(--font-sans);color:var(--text-secondary)}</style></head><body>
<div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap"><span style="display:inline-grid;place-items:center;height:32px;padding:0 12px;border-radius:6px;background:var(--surface-primary);border:1px solid var(--border-default);font:500 13px var(--font-sans);box-shadow:var(--focus-ring)">Focused</span><span style="display:inline-grid;place-items:center;height:32px;padding:0 12px;border-radius:6px;background:var(--surface-selected);border:1.5px solid var(--gold-500);font:500 13px var(--font-sans)">Selected</span><svg width="72" height="62" viewBox="0 0 72 62"><polygon points="18,3 54,3 69,31 54,59 18,59 3,31" fill="var(--gold-50)" stroke="var(--gold-500)" stroke-width="2"/></svg><svg width="72" height="62" viewBox="0 0 72 62"><polygon points="18,3 54,3 69,31 54,59 18,59 3,31" fill="var(--surface-primary)" stroke="var(--canvas-multiselect)" stroke-width="2"/></svg><span class="cap" style="max-width:150px">Canvas selection is a 2px gold outline; multi-selection is blue so a selected group never reads as an activated Agent.</span></div><p class="note">Focus ring: <span style="font-family:var(--font-mono);font-size:11px">0 0 0 2px canvas, 0 0 0 4px gold</span>. Always visible, never replaced by colour alone, never removed.</p>
</body></html>
