<!-- @dsCard group="Colors" viewport="700x180" name="Environment & runtime" subtitle="Fixed meanings — gold is Live, blue is Simulation" -->
<!doctype html><html data-theme="light"><head><meta charset="utf-8"><title>Environment & runtime</title>
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:14px;background:var(--surface-canvas);font-family:var(--font-sans);color:var(--text-primary)}.sw{display:flex;gap:0}.sw>div{flex:1;height:52px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:4px;font:500 9px var(--font-mono);letter-spacing:0}.lb{display:flex;gap:0;margin-top:3px}.lb>div{flex:1;text-align:center;font:400 9px var(--font-mono);color:var(--text-tertiary)}.tile{display:flex;flex-direction:column;gap:5px;min-width:0}.tilerow{display:flex;gap:8px}.chip{flex:1;display:flex;flex-direction:column;gap:4px;min-width:0}.box{height:40px;border-radius:4px;border:1px solid var(--border-subtle)}.cap{font:400 10px var(--font-mono);color:var(--text-tertiary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.nm{font:500 11px var(--font-sans);color:var(--text-primary)}</style></head><body>
<div style="display:grid;grid-template-columns:repeat(5,1fr);gap:8px"><div class="chip"><div class="box" style="height:28px;background:var(--runtime-draft)"></div><span class="cap">Draft</span></div><div class="chip"><div class="box" style="height:28px;background:var(--runtime-observed)"></div><span class="cap">Observed</span></div><div class="chip"><div class="box" style="height:28px;background:var(--runtime-inferred)"></div><span class="cap">Inferred</span></div><div class="chip"><div class="box" style="height:28px;background:var(--runtime-learning)"></div><span class="cap">Learning</span></div><div class="chip"><div class="box" style="height:28px;background:var(--runtime-simulation)"></div><span class="cap">Simulation</span></div><div class="chip"><div class="box" style="height:28px;background:var(--runtime-validated)"></div><span class="cap">Validated</span></div><div class="chip"><div class="box" style="height:28px;background:var(--runtime-live)"></div><span class="cap">Live</span></div><div class="chip"><div class="box" style="height:28px;background:var(--runtime-paused)"></div><span class="cap">Paused</span></div><div class="chip"><div class="box" style="height:28px;background:var(--runtime-stopped)"></div><span class="cap">Stopped</span></div><div class="chip"><div class="box" style="height:28px;background:var(--runtime-killed)"></div><span class="cap">Killed</span></div></div><p style="margin:10px 0 0;font:400 12px/17px var(--font-sans);color:var(--text-secondary)">These never drift. Gold means active LAMP intelligence — Live execution, selection, bonding. Simulation is always blue and must never be mistaken for Live.</p>
</body></html>
