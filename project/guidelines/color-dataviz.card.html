<!-- @dsCard group="Colors" viewport="700x170" name="Data visualization" subtitle="Gold primary, blue comparison, then a restrained categorical run" -->
<!doctype html><html data-theme="light"><head><meta charset="utf-8"><title>Data visualization</title>
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:14px;background:var(--surface-canvas);font-family:var(--font-sans);color:var(--text-primary)}.sw{display:flex;gap:0}.sw>div{flex:1;height:52px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:4px;font:500 9px var(--font-mono);letter-spacing:0}.lb{display:flex;gap:0;margin-top:3px}.lb>div{flex:1;text-align:center;font:400 9px var(--font-mono);color:var(--text-tertiary)}.tile{display:flex;flex-direction:column;gap:5px;min-width:0}.tilerow{display:flex;gap:8px}.chip{flex:1;display:flex;flex-direction:column;gap:4px;min-width:0}.box{height:40px;border-radius:4px;border:1px solid var(--border-subtle)}.cap{font:400 10px var(--font-mono);color:var(--text-tertiary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.nm{font:500 11px var(--font-sans);color:var(--text-primary)}</style></head><body>
<div class="sw" style="border-radius:4px;overflow:hidden"><div style="background:var(--dataviz-1);height:42px;color:#fff">1</div><div style="background:var(--dataviz-2);height:42px;color:#fff">2</div><div style="background:var(--dataviz-3);height:42px;color:#fff">3</div><div style="background:var(--dataviz-4);height:42px;color:#fff">4</div><div style="background:var(--dataviz-5);height:42px;color:#fff">5</div><div style="background:var(--dataviz-6);height:42px;color:#fff">6</div><div style="background:var(--dataviz-7);height:42px;color:#fff">7</div><div style="background:var(--dataviz-8);height:42px;color:#fff">8</div></div><div class="lb"><div>#D6A82E</div><div>#3478F6</div><div>#22A06B</div><div>#7A6FF0</div><div>#D9822B</div><div>#3CA6A6</div><div>#B55FC1</div><div>#657A9A</div></div><div class="sw" style="margin-top:10px;border-radius:4px;overflow:hidden"><div style="background:var(--dataviz-neutral-1);height:24px;color:#fff;font-size:9px">n1</div><div style="background:var(--dataviz-neutral-2);height:24px;color:#fff;font-size:9px">n2</div><div style="background:var(--dataviz-neutral-3);height:24px;color:#fff;font-size:9px">n3</div><div style="background:var(--dataviz-neutral-4);height:24px;color:#fff;font-size:9px">n4</div><div style="background:var(--dataviz-neutral-5);height:24px;color:#fff;font-size:9px">n5</div></div><p style="margin:9px 0 0;font:400 12px/17px var(--font-sans);color:var(--text-secondary)">No rainbow palettes, no gradients in normal charts, no 3D. The neutral ramp is for comparison and de-emphasis.</p>
</body></html>
