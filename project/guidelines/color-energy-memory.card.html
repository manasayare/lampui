<!-- @dsCard group="Colors" viewport="700x160" name="Energy & memory" subtitle="Conductive gold for runtime, violet-silver for stored context" -->
<!doctype html><html data-theme="light"><head><meta charset="utf-8"><title>Energy & memory</title>
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:14px;background:var(--surface-canvas);font-family:var(--font-sans);color:var(--text-primary)}.sw{display:flex;gap:0}.sw>div{flex:1;height:52px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:4px;font:500 9px var(--font-mono);letter-spacing:0}.lb{display:flex;gap:0;margin-top:3px}.lb>div{flex:1;text-align:center;font:400 9px var(--font-mono);color:var(--text-tertiary)}.tile{display:flex;flex-direction:column;gap:5px;min-width:0}.tilerow{display:flex;gap:8px}.chip{flex:1;display:flex;flex-direction:column;gap:4px;min-width:0}.box{height:40px;border-radius:4px;border:1px solid var(--border-subtle)}.cap{font:400 10px var(--font-mono);color:var(--text-tertiary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.nm{font:500 11px var(--font-sans);color:var(--text-primary)}</style></head><body>
<div class="tilerow"><div class="chip"><div class="box" style="background:var(--energy-core)"></div><span class="cap">energy.core</span></div><div class="chip"><div class="box" style="background:var(--energy-bright)"></div><span class="cap">energy.bright</span></div><div class="chip"><div class="box" style="background:var(--energy-highlight)"></div><span class="cap">energy.highlight</span></div><div class="chip"><div class="box" style="background:var(--energy-deep)"></div><span class="cap">energy.deep</span></div><div class="chip"><div class="box" style="background:var(--simulation-energy)"></div><span class="cap">simulation.energy</span></div></div><div class="tilerow" style="margin-top:8px"><div class="chip"><div class="box" style="background:var(--memory-core)"></div><span class="cap">memory.core</span></div><div class="chip"><div class="box" style="background:var(--memory-subtle)"></div><span class="cap">memory.subtle</span></div><div class="chip"><div class="box" style="background:var(--memory-dark)"></div><span class="cap">memory.dark</span></div><div class="chip"><div class="box" style="background:var(--energy-glow)"></div><span class="cap">energy.glow</span></div><div class="chip"><div class="box" style="background:var(--simulation-glow)"></div><span class="cap">simulation.glow</span></div></div><p style="margin:9px 0 0;font:400 12px/17px var(--font-sans);color:var(--text-secondary)">Memory is deliberately not gold — stored context must read differently from active execution.</p>
</body></html>
