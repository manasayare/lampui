<!-- @dsCard group="Colors" viewport="700x190" name="Status" subtitle="Five semantic states, each with a subtle background" -->
<!doctype html><html data-theme="light"><head><meta charset="utf-8"><title>Status</title>
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:14px;background:var(--surface-canvas);font-family:var(--font-sans);color:var(--text-primary)}.sw{display:flex;gap:0}.sw>div{flex:1;height:52px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:4px;font:500 9px var(--font-mono);letter-spacing:0}.lb{display:flex;gap:0;margin-top:3px}.lb>div{flex:1;text-align:center;font:400 9px var(--font-mono);color:var(--text-tertiary)}.tile{display:flex;flex-direction:column;gap:5px;min-width:0}.tilerow{display:flex;gap:8px}.chip{flex:1;display:flex;flex-direction:column;gap:4px;min-width:0}.box{height:40px;border-radius:4px;border:1px solid var(--border-subtle)}.cap{font:400 10px var(--font-mono);color:var(--text-tertiary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.nm{font:500 11px var(--font-sans);color:var(--text-primary)}</style></head><body>
<div style="display:flex;flex-direction:column;gap:6px"><div style="display:flex;align-items:center;gap:10px"><span style="width:10px;height:10px;border-radius:50%;background:var(--status-success)"></span><span class="nm" style="width:76px">success</span><span class="cap" style="width:64px">#22A06B</span><span style="display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:999px;background:var(--status-success-bg);color:var(--status-success-text);font:500 11px var(--font-sans)">Validated</span></div><div style="display:flex;align-items:center;gap:10px"><span style="width:10px;height:10px;border-radius:50%;background:var(--status-warning)"></span><span class="nm" style="width:76px">warning</span><span class="cap" style="width:64px">#D9822B</span><span style="display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:999px;background:var(--status-warning-bg);color:var(--status-warning-text);font:500 11px var(--font-sans)">Needs attention</span></div><div style="display:flex;align-items:center;gap:10px"><span style="width:10px;height:10px;border-radius:50%;background:var(--status-danger)"></span><span class="nm" style="width:76px">danger</span><span class="cap" style="width:64px">#D64545</span><span style="display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:999px;background:var(--status-danger-bg);color:var(--status-danger-text);font:500 11px var(--font-sans)">Error</span></div><div style="display:flex;align-items:center;gap:10px"><span style="width:10px;height:10px;border-radius:50%;background:var(--status-info)"></span><span class="nm" style="width:76px">info</span><span class="cap" style="width:64px">#3478F6</span><span style="display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:999px;background:var(--status-info-bg);color:var(--status-info-text);font:500 11px var(--font-sans)">Simulation</span></div><div style="display:flex;align-items:center;gap:10px"><span style="width:10px;height:10px;border-radius:50%;background:var(--status-waiting)"></span><span class="nm" style="width:76px">waiting</span><span class="cap" style="width:64px">#7A6FF0</span><span style="display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:999px;background:var(--status-waiting-bg);color:var(--status-waiting-text);font:500 11px var(--font-sans)">Needs human</span></div><div style="display:flex;align-items:center;gap:10px"><span style="width:10px;height:10px;border-radius:50%;background:var(--status-neutral)"></span><span class="nm" style="width:76px">neutral</span><span class="cap" style="width:64px">#82827A</span><span style="display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:999px;background:var(--status-neutral-bg);color:var(--status-neutral-text);font:500 11px var(--font-sans)">Draft</span></div></div>
</body></html>
