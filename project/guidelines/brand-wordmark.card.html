<!doctype html><html data-theme="light"><head><meta charset="utf-8"><title>Wordmark</title>
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:14px;background:var(--surface-canvas);font-family:var(--font-sans);color:var(--text-primary)}.cap{font:400 10px var(--font-mono);color:var(--text-tertiary)}.nm{font:500 11px var(--font-sans)}.note{margin:11px 0 0;font:400 12px/17px var(--font-sans);color:var(--text-secondary)}</style></head><body>
<div style="display:flex;gap:0;border:1px solid var(--border-default);border-radius:8px;overflow:hidden"><div style="flex:1;background:var(--neutral-925);display:grid;place-items:center;height:120px"><span style="font:600 28px var(--font-sans);letter-spacing:.14em;color:var(--gold-400)">LAMP</span></div><div style="flex:1;background:var(--neutral-50);display:grid;place-items:center;height:120px"><span style="font:600 28px var(--font-sans);letter-spacing:.14em;color:var(--neutral-900)">LAMP</span></div><div style="flex:1;background:var(--gold-500);display:grid;place-items:center;height:120px"><span style="font:600 28px var(--font-sans);letter-spacing:.14em;color:var(--neutral-950)">LAMP</span></div></div><p class="note">Geist Sans 600, +0.14em tracking. Gold on graphite, graphite on warm white, or graphite on gold. Drop a real mark at <span style="font-family:var(--font-mono);font-size:11px">assets/logo.svg</span> and these usages swap.</p>
</body></html>
