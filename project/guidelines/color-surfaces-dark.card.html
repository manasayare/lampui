<!-- @dsCard group="Colors" viewport="700x150" name="Surfaces — dark" subtitle="Same semantic names, re-pointed for prolonged technical work" -->
<!doctype html><html data-theme="dark"><head><meta charset="utf-8"><title>Surfaces — dark</title>
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:14px;background:var(--surface-canvas);font-family:var(--font-sans);color:var(--text-primary)}.sw{display:flex;gap:0}.sw>div{flex:1;height:52px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:4px;font:500 9px var(--font-mono);letter-spacing:0}.lb{display:flex;gap:0;margin-top:3px}.lb>div{flex:1;text-align:center;font:400 9px var(--font-mono);color:var(--text-tertiary)}.tile{display:flex;flex-direction:column;gap:5px;min-width:0}.tilerow{display:flex;gap:8px}.chip{flex:1;display:flex;flex-direction:column;gap:4px;min-width:0}.box{height:40px;border-radius:4px;border:1px solid var(--border-subtle)}.cap{font:400 10px var(--font-mono);color:var(--text-tertiary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.nm{font:500 11px var(--font-sans);color:var(--text-primary)}</style></head><body>
<div class="tilerow"><div class="chip"><div class="box" style="background:var(--surface-canvas)"></div><span class="nm">canvas</span><span class="cap">#0B0B0A</span></div><div class="chip"><div class="box" style="background:var(--surface-primary)"></div><span class="nm">primary</span><span class="cap">#111110</span></div><div class="chip"><div class="box" style="background:var(--surface-secondary)"></div><span class="nm">secondary</span><span class="cap">#171716</span></div><div class="chip"><div class="box" style="background:var(--surface-raised)"></div><span class="nm">raised</span><span class="cap">#262624</span></div><div class="chip"><div class="box" style="background:var(--surface-overlay)"></div><span class="nm">overlay</span><span class="cap">#30302D</span></div><div class="chip"><div class="box" style="background:var(--surface-selected)"></div><span class="nm">selected</span><span class="cap">#281C08</span></div></div><p style="margin:10px 0 0;font:400 12px/17px var(--font-sans);color:var(--text-secondary)">Components never reference a primitive scale. Switching <span style="font-family:var(--font-mono);font-size:11px">data-theme="dark"</span> re-points the same semantic tokens — no theme-specific component structures.</p>
</body></html>
