<!doctype html><html data-theme="light"><head><meta charset="utf-8"><title>Genie</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:14px;background:var(--surface-canvas);font-family:var(--font-sans)}.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}.rowt{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}.col{display:flex;flex-direction:column;gap:12px}.lbl{font-size:9px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--text-tertiary);margin-bottom:-4px}.u{display:flex;flex-direction:column;align-items:center;gap:5px}.cap{font:400 10px var(--font-mono);color:var(--text-tertiary)}</style></head><body><div id="root"></div>
<script type="text/babel">
const L = window.LAMPDesignSystem_980d6d;

const { GenieCard, HexLattice, AgentHex, Button, IconButton, Badge } = L;
const mini = (n) => Array.from({length:n},(_,i)=>({col:i%4,row:Math.floor(i/4),key:i,node:<AgentHex size="xs" detail="glyph" state={i===1?'running':'bonded'} environment={i===1?'live':'draft'} />}));
function Demo(){return <div className="col">
 <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12,alignItems:'start'}}>
  <GenieCard name="Finance" purpose="Vendor payments, reconciliation and month-end close." status="live" live
   hive={<HexLattice size="xs" gap={0} cells={mini(7)} />}
   stats={[{label:'Playbooks',value:6},{label:'Agents',value:23},{label:'Runs today',value:412},{label:'Human touches',value:11}]}
   actions={<IconButton icon="more_horiz" label="Genie actions" size="sm" />} />
  <GenieCard name="Customer Ops" purpose="Ticket triage, escalation and customer follow-up." status="live"
   hive={<HexLattice size="xs" gap={0} cells={mini(5)} />}
   stats={[{label:'Playbooks',value:4},{label:'Agents',value:17},{label:'Runs today',value:208}]} />
  <GenieCard name="Recruitment" purpose="CV screening and interview scheduling." status="killed"
   stats={[{label:'Playbooks',value:2},{label:'Agents',value:6},{label:'Runs today',value:0}]}
   actions={<Button size="sm" variant="secondary" icon="play_arrow">Resume</Button>} />
  <GenieCard name="Procurement" purpose="Observed from 6 weeks of vendor activity. Not yet configured." status="inferred" selected
   stats={[{label:'Suggested Playbooks',value:3},{label:'Evidence',value:41}]}
   actions={<Badge tone="waiting" micro>Inferred</Badge>} />
 </div>
 <span className="cap">Gold perimeter only while live or selected — never permanently outlined.</span>
</div>}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script></body></html>
