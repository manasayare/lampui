<!-- @dsCard group="LAMP objects" viewport="700x320" name="Tool tile" subtitle="Square with a 6px radius — neutral surface, provider mark inside" -->
<!doctype html><html data-theme="light"><head><meta charset="utf-8"><title>Tool tile</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:14px;background:var(--surface-canvas);font-family:var(--font-sans)}.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}.rowt{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}.col{display:flex;flex-direction:column;gap:12px}.lbl{font-size:9px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--text-tertiary);margin-bottom:-4px}.u{display:flex;flex-direction:column;align-items:center;gap:5px}.cap{font:400 10px var(--font-mono);color:var(--text-tertiary)}</style></head><body><div id="root"></div>
<script type="text/babel">
const L = window.LAMPDesignSystem_980d6d;

const { ToolTile, ToolRow, Badge } = L;
const U = ({label,children}) => <span className="u">{children}<span className="cap">{label}</span></span>;
function Demo(){return <div className="col">
 <div className="lbl">Sizes — md 32 is the default</div>
 <div className="row" style={{alignItems:'flex-end'}}>
  <U label="sm 24"><ToolTile size="sm" provider="sap" /></U>
  <U label="md 32"><ToolTile size="md" provider="sap" /></U>
  <U label="lg 40"><ToolTile size="lg" provider="sap" /></U>
  <U label="xl 48"><ToolTile size="xl" provider="sap" /></U>
 </div>
 <div className="lbl">Connection states</div>
 <div className="row">
  <U label="available"><ToolTile state="available" glyph="extension" /></U>
  <U label="connected"><ToolTile state="connected" provider="googledrive" /></U>
  <U label="auth required"><ToolTile state="authorizationRequired" provider="salesforce" /></U>
  <U label="expired"><ToolTile state="expired" provider="sap" /></U>
  <U label="degraded"><ToolTile state="degraded" provider="whatsapp" /></U>
  <U label="error"><ToolTile state="error" provider="gmail" /></U>
  <U label="read-only"><ToolTile state="readOnly" glyph="api" /></U>
  <U label="blocked"><ToolTile state="blocked" glyph="lock" /></U>
  <U label="disabled"><ToolTile state="disabled" glyph="extension" /></U>
 </div>
 <div className="lbl">Provider marks are monochrome inside a neutral tile — brand colour never fills the tile</div>
 <div className="row">
  <ToolTile provider="gmail" size="lg" /><ToolTile provider="salesforce" size="lg" /><ToolTile provider="sap" size="lg" />
  <ToolTile provider="googledrive" size="lg" /><ToolTile provider="whatsapp" size="lg" /><ToolTile provider="slack" size="lg" />
  <ToolTile glyph="api" size="lg" /><ToolTile glyph="webhook" size="lg" />
 </div>
 <div className="lbl">Directory and health row</div>
 <div style={{border:'1px solid var(--border-default)',borderRadius:8,background:'var(--surface-primary)',overflow:'hidden'}}>
  <ToolRow provider="sap" name="SAP" account="northwind-prod" state="connected" permission="Write" usedBy={4} health="99.4%" risk="High" />
  <ToolRow provider="salesforce" name="Salesforce" account="finance@northwind.com" state="authorizationRequired" permission="Write" usedBy={2} risk="High" />
 </div>
</div>}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script></body></html>
