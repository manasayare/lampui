<!-- @dsCard group="LAMP objects" viewport="700x300" name="Skill orb" subtitle="Circle — reusable capability, always subordinate to the Agent" -->
<!doctype html><html data-theme="light"><head><meta charset="utf-8"><title>Skill orb</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:14px;background:var(--surface-canvas);font-family:var(--font-sans)}.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}.rowt{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}.col{display:flex;flex-direction:column;gap:12px}.lbl{font-size:9px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--text-tertiary);margin-bottom:-4px}.u{display:flex;flex-direction:column;align-items:center;gap:5px}.cap{font:400 10px var(--font-mono);color:var(--text-tertiary)}</style></head><body><div id="root"></div>
<script type="text/babel">
const L = window.LAMPDesignSystem_980d6d;

const { SkillOrb, AgentHex } = L;
const U = ({label,children}) => <span className="u">{children}<span className="cap">{label}</span></span>;
function Demo(){return <div className="col">
 <div className="lbl">Sizes — md 28 is the default</div>
 <div className="row" style={{alignItems:'flex-end'}}>
  <U label="xs 16"><SkillOrb size="xs" glyph="rule" /></U>
  <U label="sm 20"><SkillOrb size="sm" glyph="rule" /></U>
  <U label="md 28"><SkillOrb size="md" glyph="rule" /></U>
  <U label="lg 36"><SkillOrb size="lg" glyph="rule" /></U>
  <U label="xl 48"><SkillOrb size="xl" glyph="rule" /></U>
 </div>
 <div className="lbl">States</div>
 <div className="row">
  <U label="available"><SkillOrb state="available" glyph="add" /></U>
  <U label="attached"><SkillOrb state="attached" glyph="rule" /></U>
  <U label="active"><SkillOrb state="active" glyph="rule" /></U>
  <U label="running"><SkillOrb state="running" glyph="fact_check" /></U>
  <U label="waiting"><SkillOrb state="waiting" glyph="hourglass_top" /></U>
  <U label="error"><SkillOrb state="error" glyph="rule" /></U>
  <U label="suggested"><SkillOrb state="suggested" glyph="auto_awesome" /></U>
  <U label="learned"><SkillOrb state="learned" glyph="school" /></U>
  <U label="disabled"><SkillOrb state="disabled" glyph="rule" /></U>
 </div>
 <div className="lbl">Labelled, and in scale against an Agent</div>
 <div className="rowt" style={{alignItems:'center'}}>
  <SkillOrb name="Extract" glyph="content_paste" state="attached" label />
  <SkillOrb name="Reconcile" glyph="rule" state="attached" label />
  <SkillOrb name="Verify" glyph="fact_check" state="running" label />
  <SkillOrb name="Translate" glyph="translate" state="suggested" label />
  <span style={{width:16}} />
  <AgentHex size="md" detail="glyph" />
  <span style={{display:'flex',gap:6,alignItems:'center'}}>
   <SkillOrb size="sm" glyph="content_paste" state="attached" /><SkillOrb size="sm" glyph="rule" state="attached" /><SkillOrb size="sm" glyph="fact_check" state="active" />
   <span className="cap">Skills stay smaller than the hexagon</span>
  </span>
 </div>
</div>}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script></body></html>
