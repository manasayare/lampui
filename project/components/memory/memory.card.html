<!doctype html><html data-theme="light"><head><meta charset="utf-8"><title>Memory</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:14px;background:var(--surface-canvas);font-family:var(--font-sans)}.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.rowt{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start}.col{display:flex;flex-direction:column;gap:10px}.lbl{font-size:9px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--text-tertiary);margin-bottom:-2px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}</style></head><body><div id="root"></div>
<script type="text/babel">
const L = window.LAMPDesignSystem_980d6d;

const { MemoryBadge, MemoryScope, MemoryConfidence, MemoryFact, MemoryUsageBar, MemoryTimeline } = L;
function Demo(){return <div className="col">
 <div className="lbl">Fact types — glyph and word, never colour alone</div>
 <div className="row"><MemoryBadge type="explicitFact" /><MemoryBadge type="observedPattern" /><MemoryBadge type="inferredPattern" /><MemoryBadge type="policy" /><MemoryBadge type="preference" /><MemoryBadge type="exception" /><MemoryBadge type="assumption" /><MemoryBadge type="relationship" /><MemoryBadge type="decision" /><MemoryBadge type="rule" /><MemoryBadge type="workingMemory" /></div>
 <div className="lbl">Scope — bar height grows with breadth · confidence</div>
 <div className="row"><MemoryScope scope="agent" full /><MemoryScope scope="playbook" full /><MemoryScope scope="genie" full /><MemoryScope scope="lamp" full /><MemoryConfidence level="low" /><MemoryConfidence level="medium" /><MemoryConfidence level="high" /><MemoryConfidence level="veryHigh" showValue /></div>
 <div className="g2" style={{gridTemplateColumns:'1.2fr 1fr'}}>
  <div className="col">
   <MemoryFact type="observedPattern" scope="genie" confidence="high" evidenceCount={23} fact="Vendor approvals usually happen through WhatsApp before they are entered in SAP." source="WhatsApp threads, SAP records" lastConfirmed="2 days ago" owner="Finance" onConfirm={()=>{}} onCorrect={()=>{}} onIgnore={()=>{}} />
   <MemoryFact type="policy" scope="lamp" confidence="veryHigh" fact="Payments above ₹50,000 require a second approver." access="Shared" contradictions={1} lastConfirmed="12 Sep" />
  </div>
  <div className="col">
   <div className="lbl">Context breakdown</div>
   <MemoryUsageBar segments={[{key:'agent',label:'Agent working memory',value:618},{key:'playbook',label:'Playbook memory',value:402},{key:'genie',label:'Genie memory',value:771},{key:'lamp',label:'LAMP memory',value:340},{key:'evidence',label:'Retrieved evidence',value:1281}]} />
   <div className="lbl">History</div>
   <MemoryTimeline items={[{title:'Fact corrected',detail:'Threshold changed to ₹50,000',actor:'Asha Rao',timestamp:'12 Sep 14:02',accent:true},{title:'Promoted to Genie memory',actor:'LAMP',timestamp:'12 Sep 14:03',current:true}]} />
  </div>
 </div>
</div>}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script></body></html>
