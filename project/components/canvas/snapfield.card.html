<!-- @dsCard group="Canvas" viewport="700x400" name="Drag to snap" subtitle="Drag an Agent — it snaps to the hex lattice; arrow keys do the same" -->
<!doctype html><html data-theme="light"><head><meta charset="utf-8"><title>Drag to snap</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:12px;background:var(--surface-canvas);font-family:var(--font-sans)}
.hint{display:flex;align-items:center;gap:10px;font:400 11px var(--font-mono);color:var(--text-tertiary);padding:4px 2px 8px}</style></head><body><div id="root"></div>
<script type="text/babel">
const { SnapField, AgentHex, CanvasSurface, BondLayer, BondEdge, HexCenter, Kbd } = window.LAMPDesignSystem_980d6d;
const START = [
  { id:'intake', name:'Invoice Intake', col:0, row:0, role:'coordinator', state:'bonded' },
  { id:'matcher', name:'Invoice Matcher', col:1, row:0, role:'specialist', state:'bonded' },
  { id:'verifier', name:'Vendor Verifier', col:2, row:0, role:'specialist', state:'bonded' },
  { id:'loose', name:'Ledger Sync', col:5, row:1, role:'standard', state:'idle' },
];
const BONDS = [['intake','matcher'],['matcher','verifier']];
function Demo(){
  const [agents, setAgents] = React.useState(START);
  const [sel, setSel] = React.useState('matcher');
  const [snap, setSnap] = React.useState('idle');
  const by = {}; agents.forEach(a => by[a.id] = a);
  const gap = 22, size = 'md';
  return <div>
    <div className="hint">
      <span>{snap === 'snapReady' ? 'Snap to slot' : snap === 'dragging' ? 'Dragging — no slot in range' : 'Drag any Agent, or focus one and use the arrow keys'}</span>
      <Kbd keys={['←','→','↑','↓']} />
    </div>
    <CanvasSurface grid="dots" environment="draft" state={snap === 'snapReady' ? 'snapping' : snap} style={{height:312,borderRadius:8,border:'1px solid var(--border-default)',overflow:'hidden'}}>
      <SnapField agents={agents} size={size} gap={gap} width={660} height={312} onChange={setAgents}
        selectedId={sel} onSelect={(a)=>setSel(a.id)} onSnapStateChange={setSnap} origin={{x:80,y:70}}
        bonds={<BondLayer width={420} height={180}>{BONDS.filter(b=>by[b[0]]&&by[b[1]]).map(b=>{
          const A = by[b[0]], B = by[b[1]];
          const near = Math.abs(A.col-B.col) <= 1 && Math.abs(A.row-B.row) <= 1;
          return near ? <BondEdge key={b.join()} from={HexCenter(A.col,A.row,size,gap)} to={HexCenter(B.col,B.row,size,gap)} state="valid" /> : null;
        })}</BondLayer>}
        renderAgent={(a,f)=><AgentHex size={size} detail={f.dragging?'glyph':'name'} name={a.name} role={a.role}
          state={f.selected && !f.dragging ? 'selected' : a.state} onClick={()=>{}} />} />
    </CanvasSurface>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script></body></html>
