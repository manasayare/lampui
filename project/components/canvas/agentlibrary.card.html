<!-- @dsCard group="Canvas" viewport="860x520" name="Add an Agent" subtitle="Drag one out of the library; name it before it exists" -->
<!doctype html><html data-theme="light"><head><meta charset="utf-8"><title>Add an Agent</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/Draggable.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:12px;background:var(--surface-canvas);font-family:var(--font-sans)}
.wrap{display:flex;gap:12px;align-items:stretch}
.lib{width:252px;flex:none}
.field{flex:1;min-width:0}
.hint{font:400 11px var(--font-mono);color:var(--text-tertiary);padding:4px 2px 8px}
.hint b{font-weight:400;color:var(--text-brand)}</style></head><body><div id="root"></div>
<script type="text/babel">
const {
  SnapField, AgentLibrary, NewAgentDialog, AgentHex, CanvasSurface, FreeCellAt,
} = window.LAMPDesignSystem_980d6d;

const START = [
  { id:'intake',  name:'Invoice Intake',  col:0, row:0, role:'coordinator', state:'bonded' },
  { id:'matcher', name:'Invoice Matcher', col:1, row:0, role:'specialist',  state:'bonded' },
];

const TOOLS = [
  { provider:'sap',     name:'SAP',     state:'connected' },
  { provider:'gmail',   name:'Gmail',   state:'connected' },
  { provider:'zendesk', name:'Zendesk', state:'authorizationRequired' },
];

function Demo(){
  const [agents, setAgents] = React.useState(START);
  const [sel, setSel]       = React.useState(null);
  /* { archetype, cell } — the drop resolved the cell, the dialog only names it. */
  const [pending, setPending] = React.useState(null);
  const fieldRef = React.useRef(null);

  const size = 'md', gap = 40, origin = { x: 70, y: 56 };
  const geometry = { agents, size, gap, width: 540, height: 400, origin };

  const open = (archetype, point) =>
    setPending({ archetype, cell: FreeCellAt(point, geometry) });

  return <div>
    <div className="hint">
      {pending ? <b>Name it — an Agent nobody named is an Agent nobody can read</b>
               : 'Drag an Agent from the library onto the canvas, or click one'}
    </div>
    <div className="wrap">
      <div className="lib" style={{height:400}}>
        <AgentLibrary
          size={size}
          dropTarget={fieldRef}
          onDrop={open}
          /* The non-drag path lands it in the middle of the field. */
          onAdd={(a)=>open(a, { x: geometry.width/2, y: geometry.height/2 })}
          style={{height:'100%'}} />
      </div>
      <div className="field">
        <CanvasSurface grid="dots" environment="draft"
          style={{height:400,borderRadius:8,border:'1px solid var(--border-default)',overflow:'hidden'}}>
          <SnapField
            ref={fieldRef}
            agents={agents} size={size} gap={gap} width={540} height={400} origin={origin}
            onChange={setAgents}
            selectedId={sel} onSelect={(a)=>setSel(a.id)}
            renderAgent={(a,f)=>(
              <AgentHex size={size} detail={f.dragging?'glyph':'name'} name={a.name} role={a.role}
                state={f.selected && !f.dragging ? 'selected' : a.state} onClick={()=>{}} />
            )} />
        </CanvasSurface>
      </div>
    </div>

    {pending ? (
      <NewAgentDialog
        archetype={pending.archetype}
        cell={pending.cell}
        availableTools={TOOLS}
        onCancel={()=>setPending(null)}
        onCreate={(draft)=>{
          const id = draft.name.toLowerCase().replace(/[^a-z0-9]+/g,'-') + '-' + agents.length;
          setAgents(agents.concat([Object.assign({ id }, draft)]));
          setSel(id);
          setPending(null);
        }} />
    ) : null}
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script></body></html>
